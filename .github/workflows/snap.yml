# Snap packaging only — does not rebuild the desktop app or touch GitHub Releases.
# Manual: Actions → Snap → Run workflow
#
# DO NOT publish to the Snap Store until tested on a real Linux machine.
# Default is build + GitHub artifact only (publish=false).
# Optimization: packs the existing Release .deb (no Node/Rust/Tauri compile).
name: Snap

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag that already has a .deb asset (e.g. v2.23.0)
        required: true
        default: v2.23.0
        type: string
      recipe_ref:
        description: Git ref that contains snap/snapcraft.yaml (usually main)
        required: true
        default: main
        type: string
      publish:
        description: Upload to Snap Store (keep OFF until Linux install is verified)
        required: true
        default: false
        type: boolean
      channel:
        description: Snap Store channel (only if publish is true; prefer edge for testing)
        required: true
        default: edge
        type: choice
        options:
          - edge
          - beta
          - candidate
          - stable

concurrency:
  group: snap-${{ inputs.release_tag }}-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snap:
    name: Snap ${{ inputs.release_tag }} → ${{ inputs.channel }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout snap recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recipe_ref }}

      - name: Ensure snap recipe exists
        run: |
          test -f snap/snapcraft.yaml || {
            echo "::error::snap/snapcraft.yaml missing on recipe_ref=${{ inputs.recipe_ref }}"
            exit 1
          }

      - name: Download .deb from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prebuilt
          echo "Downloading *.deb from release ${{ inputs.release_tag }}..."
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            -p "*.deb" \
            -D prebuilt
          ls -la prebuilt
          test -n "$(ls -1 prebuilt/*.deb 2>/dev/null | head -n1)" || {
            echo "::error::No .deb on release ${{ inputs.release_tag }}. Ship with release.yml first."
            exit 1
          }

      - name: Align snap version with release tag
        run: |
          set -euo pipefail
          ver="${{ inputs.release_tag }}"
          ver="${ver#v}"
          sed -i -E "s/^version: .*/version: '${ver}'/" snap/snapcraft.yaml
          grep -E '^version:' snap/snapcraft.yaml

      - name: Build snap (pack prebuilt deb only)
        id: build
        uses: snapcore/action-build@v1
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: zync-snap-${{ inputs.release_tag }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

      - name: Publish to Snap Store
        if: ${{ inputs.publish }}
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ inputs.channel }}
