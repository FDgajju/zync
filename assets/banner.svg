<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <!-- Campaign banner — uses simplified mark (no shadow, no bloom, hairline frame) -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="800" height="200" rx="12" fill="url(#bg)"/>
  <rect width="798" height="198" x="1" y="1" rx="11" fill="none" stroke="url(#borderGrad)" stroke-width="1"/>

  <!-- Mark 80×80 -->
  <g transform="translate(270 60)">
    <rect x="0.8" y="0.8" width="78.4" height="78.4" rx="16.8" fill="#0f172a"/>
    <rect x="0.8" y="0.8" width="78.4" height="78.4" rx="16.8" fill="none" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.6"/>
    <g transform="translate(40 38.75) scale(0.150625) translate(-256 -256)">
      <path
        d="M128 170.667L213.333 256L128 341.333"
        stroke="#6366f1"
        stroke-width="64"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M248 341.333H392"
        stroke="#ffffff"
        stroke-width="64"
        stroke-linecap="round"
      />
    </g>
  </g>

  <text
    x="370"
    y="104"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="44"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="-0.4"
  >Zync</text>
  <text
    x="372"
    y="132"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="15"
    font-weight="500"
    fill="#94a3b8"
    letter-spacing="0.2"
  >A Modern, Native SSH Client</text>
</svg>
