<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-label="Zync">
  <!--
    Full-circle icon — for YouTube channel avatar and circular crop contexts.
    rx=256 makes the tile a perfect circle at 512×512.
    Stroke fully inset (x=5, width=502) so it stays inside the viewBox.
  -->
  <rect
    x="5"
    y="5"
    width="502"
    height="502"
    rx="251"
    fill="#0f172a"
  />
  <rect
    x="5"
    y="5"
    width="502"
    height="502"
    rx="251"
    fill="none"
    stroke="#6366f1"
    stroke-width="10"
  />

  <!-- Glyph optically centered (slight up-bias for underscore) -->
  <g transform="translate(256 248) scale(0.96) translate(-256 -256)">
    <path
      d="M128 170.667L213.333 256L128 341.333"
      stroke="#6366f1"
      stroke-width="64"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M248 341.333H392"
      stroke="#ffffff"
      stroke-width="64"
      stroke-linecap="round"
    />
  </g>
</svg>
