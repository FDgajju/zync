<svg xmlns="http://www.w3.org/2000/svg" width="420" height="112" viewBox="0 0 420 112" fill="none" role="img" aria-label="Zync">
  <!--
    Lockup for dark backgrounds.
    Grid: icon 112, gap 0.36×icon ≈ 40, wordmark optically mid-aligned.
  -->
  <!-- Mark (112×112) -->
  <g transform="translate(0 0)">
    <!-- Inset stroke so hairline is not clipped -->
    <rect x="1.1" y="1.1" width="109.8" height="109.8" rx="23.5" fill="#0f172a"/>
    <rect x="1.1" y="1.1" width="109.8" height="109.8" rx="23.5" fill="none" stroke="#6366f1" stroke-opacity="0.35" stroke-width="2.2"/>
    <g transform="translate(56 54.25) scale(0.2109375) translate(-256 -256)">
      <path
        d="M128 170.667L213.333 256L128 341.333"
        stroke="#6366f1"
        stroke-width="64"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M248 341.333H392"
        stroke="#ffffff"
        stroke-width="64"
        stroke-linecap="round"
      />
    </g>
  </g>

  <!-- Wordmark — Inter-first stack, fixed tracking -->
  <text
    x="152"
    y="74"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="48"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="-0.5"
  >Zync</text>
</svg>
