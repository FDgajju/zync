# Snap package for Zync (https://snapcraft.io/zync)
#
# Fast path (CI default): unpack a prebuilt .deb from GitHub Releases into the snap.
# Place the file at prebuilt/*.deb before running snapcraft (workflow does this).
#
# No Node/Rust rebuild — that already ran in release.yml.
name: zync
base: core22
version: '2.23.0'
summary: SSH client with terminal, files, vault, and tunnels
description: |
  Zync is a desktop SSH client with an integrated terminal, file manager,
  encrypted credential vault, and port-forwarding tunnels.

grade: stable
confinement: strict

layout:
  /usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.1

apps:
  zync:
    command: usr/bin/zync
    desktop: usr/share/applications/zync.desktop
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - home
      - ssh-keys
      - password-manager-service
      - opengl
      - wayland
      - x11
      - desktop
      - desktop-legacy
      - gsettings

parts:
  zync-deb:
    plugin: dump
    source: .
    build-packages:
      - dpkg
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
    override-build: |
      set -eu
      root="${CRAFT_PART_SRC:-${SNAPCRAFT_PART_SRC:-.}}"
      deb="$(ls -1 "$root"/prebuilt/*.deb 2>/dev/null | head -n1 || true)"
      if [ -z "${deb}" ]; then
        echo "No prebuilt/*.deb found." >&2
        echo "CI should download the GitHub Release .deb into prebuilt/ before snapcraft." >&2
        exit 1
      fi
      echo "Packaging deb: $deb"
      dpkg -x "$deb" "$CRAFT_PART_INSTALL"

      desktop="$CRAFT_PART_INSTALL/usr/share/applications/zync.desktop"
      if [ -f "$desktop" ]; then
        sed -i -e 's|^Icon=.*|Icon=/usr/share/icons/hicolor/32x32/apps/zync.png|g' "$desktop"
      fi
